<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Shivam Vaghani — Product Engineer</title>
  <desc id="desc">AI systems, full-stack products, and thoughtful digital experiences.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="0.58" stop-color="#121116"/>
      <stop offset="1" stop-color="#17151E"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B8F36B"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#F4EFE6" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      @keyframes drift { 50% { transform: translate(-8px, 6px); } }
      @keyframes pulse { 50% { opacity: .45; } }
      .orbit { transform-origin: 748px 140px; animation: drift 7s ease-in-out infinite; }
      .signal { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <rect width="900" height="280" rx="24" fill="url(#grid)"/>
  <rect x=".75" y=".75" width="898.5" height="278.5" rx="23.25" fill="none" stroke="#F4EFE6" stroke-opacity=".13" stroke-width="1.5"/>

  <circle cx="746" cy="140" r="132" fill="url(#glow)" filter="url(#soft)"/>
  <g class="orbit">
    <ellipse cx="748" cy="140" rx="116" ry="54" fill="none" stroke="#8B7CFF" stroke-opacity=".38" transform="rotate(-24 748 140)"/>
    <ellipse cx="748" cy="140" rx="104" ry="44" fill="none" stroke="#F4EFE6" stroke-opacity=".13" transform="rotate(32 748 140)"/>
    <circle cx="748" cy="140" r="58" fill="#111015" stroke="#F4EFE6" stroke-opacity=".17"/>
    <circle cx="748" cy="140" r="39" fill="none" stroke="url(#signal)" stroke-width="1.5" stroke-dasharray="2 6"/>
    <text x="748" y="150" text-anchor="middle" fill="#F4EFE6" font-size="27" font-weight="650" letter-spacing="-1">SV</text>
    <circle class="signal" cx="648" cy="92" r="4" fill="#B8F36B"/>
    <circle cx="848" cy="189" r="3" fill="#8B7CFF"/>
  </g>

  <g transform="translate(58 48)">
    <g>
      <circle cx="4" cy="5" r="4" fill="#B8F36B"/>
      <text class="mono" x="18" y="9" fill="#C8C3BC" font-size="11" letter-spacing="2">AVAILABLE FOR AMBITIOUS BUILDS</text>
    </g>

    <text x="0" y="77" fill="#F4EFE6" font-size="53" font-weight="720" letter-spacing="-2.6">Shivam Vaghani</text>
    <rect x="0" y="96" width="46" height="3" rx="1.5" fill="url(#signal)"/>
    <text x="0" y="137" fill="#B8B2AA" font-size="18" font-weight="450" letter-spacing=".1">AI/ML Engineer · Full-Stack Product Developer</text>

    <text class="mono" x="0" y="181" fill="#77717F" font-size="11" letter-spacing="1.3">AI SYSTEMS</text>
    <circle cx="93" cy="177" r="2" fill="#514D57"/>
    <text class="mono" x="106" y="181" fill="#77717F" font-size="11" letter-spacing="1.3">PRODUCT ENGINEERING</text>
    <circle cx="263" cy="177" r="2" fill="#514D57"/>
    <text class="mono" x="276" y="181" fill="#77717F" font-size="11" letter-spacing="1.3">SURAT, INDIA</text>
  </g>
</svg>